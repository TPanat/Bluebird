<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPERATION BLUEBIRD — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --panel2:#f7f9f9; --border:#eff3f4;
    --text:#0f1419; --dim:#536471; --danger:#f4212e; --warn:#ffad1f; --good:#00ba7c; --accent:#1d9bf0; --accent-dark:#1a8cd8;
    --mono:'Inter',sans-serif; --body:'IBM Plex Sans Thai',sans-serif; --display:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px;}
  .masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:26px;flex-wrap:wrap;}
  .brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.2px;}
  .brand span{color:var(--accent);}
  .tag{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.2px;}

  .login-box{max-width:380px;margin:60px auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;}
  .login-box h2{font-family:var(--display);margin:0 0 14px;font-size:19px;font-weight:800;}
  .login-box input{width:100%;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:var(--mono);font-size:14px;margin-bottom:12px;}
  .login-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,155,240,.15);}
  .btn{cursor:pointer;border:none;border-radius:9999px;font-family:var(--display);font-weight:700;font-size:14px;padding:11px 20px;background:var(--accent);color:#ffffff;}
  .btn:hover{background:var(--accent-dark);}
  .btn-ghost{background:#ffffff;border:1px solid var(--border);color:var(--text);}
  .btn-ghost:hover{background:var(--panel2);}
  .btn-danger{background:var(--danger);color:#ffffff;}
  .btn-danger:hover{filter:brightness(1.08);}
  .err{color:var(--danger);font-family:var(--mono);font-size:12.5px;font-weight:600;min-height:16px;margin-bottom:4px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .stat-strip{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-family:var(--mono);font-size:12.5px;color:var(--dim);}
  .stat b{color:var(--accent);font-size:16px;font-weight:800;display:block;}

  .cards{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px 18px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .team-name{font-family:var(--display);font-weight:800;font-size:17px;}
  .ts{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .grade-pill{font-family:var(--mono);font-size:11px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap;}
  .method-text{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;color:var(--text);margin:8px 0;}
  .cuts-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .cut-chip{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;color:var(--dim);}
  .cut-chip b{color:var(--text);}
  .score-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .score-pill{font-family:var(--mono);font-size:12px;font-weight:600;border-radius:8px;padding:5px 10px;background:rgba(29,155,240,.08);border:1px solid rgba(29,155,240,.2);color:var(--dim);}
  .score-pill b{margin-left:4px;color:var(--accent);}
  .verdict-box{margin-top:10px;border-left:3px solid var(--accent);background:rgba(29,155,240,.05);padding:8px 10px;font-size:13px;color:var(--text);line-height:1.6;border-radius:0 8px 8px 0;}

  .empty{color:var(--dim);font-family:var(--mono);font-size:13px;padding:30px;text-align:center;background:var(--panel2);border:1px dashed var(--border);border-radius:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand" style="display:flex;align-items:center;gap:8px;">
      <svg width="24" height="24" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M23.5 6.2c-.9.4-1.8.7-2.8.8 1-.6 1.8-1.6 2.2-2.8-1 .6-2 1-3.1 1.2-.9-1-2.2-1.6-3.6-1.6-2.7 0-4.9 2.2-4.9 4.9 0 .4 0 .8.1 1.1-4.1-.2-7.7-2.2-10.1-5.1-.4.7-.7 1.6-.7 2.5 0 1.7.9 3.2 2.2 4.1-.8 0-1.6-.2-2.2-.6v.1c0 2.4 1.7 4.4 3.9 4.8-.4.1-.8.2-1.3.2-.3 0-.6 0-.9-.1.6 2 2.4 3.4 4.5 3.4-1.7 1.3-3.7 2.1-6 2.1-.4 0-.8 0-1.2-.1 2.1 1.4 4.7 2.2 7.4 2.2 8.9 0 13.7-7.4 13.7-13.7v-.6c.9-.7 1.7-1.5 2.3-2.5z" fill="#1D9BF0"/>
      </svg>
      OPERATION <span>BLUEBIRD</span> — ADMIN
    </div>
    <div class="tag">INSTRUCTOR VIEW</div>
  </div>

  <div id="login-view">
    <div class="login-box">
      <h2>เข้าสู่ระบบผู้ดูแล</h2>
      <div class="err" id="login-err"></div>
      <input id="pw" type="password" placeholder="รหัสผ่านแอดมิน (ADMIN_PASSWORD)">
      <button class="btn" id="btn-login" style="width:100%;">เข้าสู่ระบบ</button>
    </div>
  </div>

  <div id="dashboard-view" style="display:none;">
    <div class="toolbar">
      <div class="stat-strip" id="stat-strip"></div>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" id="btn-refresh">รีเฟรช</button>
        <button class="btn btn-danger" id="btn-reset">ล้างข้อมูลทั้งหมด</button>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  let password = sessionStorage.getItem('bluebird_admin_pw') || '';

  function gradeColor(ci){
    if(ci<30) return 'var(--good)';
    if(ci<55) return 'var(--warn)';
    return 'var(--danger)';
  }
  function gradeLabel(ci){
    if(ci<30) return 'STABLE';
    if(ci<55) return 'AT RISK';
    if(ci<75) return 'CRISIS';
    return 'CATASTROPHIC';
  }

  async function loadData(){
    const res = await fetch('/api/admin-data', { headers: { 'x-admin-password': password } });
    if(res.status === 401){ throw new Error('รหัสผ่านไม่ถูกต้อง'); }
    if(!res.ok){ throw new Error('โหลดข้อมูลไม่สำเร็จ'); }
    const data = await res.json();
    return data.rows || [];
  }

  function renderStats(rows){
    const n = rows.length;
    const avgCI = n ? Math.round(rows.reduce((s,r)=>s+(r.crisisIndex||0),0)/n) : 0;
    const highRisk = rows.filter(r => (r.crisisIndex||0) >= 55).length;
    $('#stat-strip').innerHTML = `
      <div class="stat"><b>${n}</b>ทีมที่ส่งคำตอบ</div>
      <div class="stat"><b>${avgCI}</b>Crisis Index เฉลี่ย</div>
      <div class="stat"><b>${highRisk}</b>ทีมที่อยู่ในระดับวิกฤตขึ้นไป</div>
    `;
  }

  function renderCards(rows){
    if(rows.length === 0){
      $('#cards').innerHTML = '<div class="empty">ยังไม่มีทีมใดส่งคำตอบ</div>';
      return;
    }
    $('#cards').innerHTML = rows.map(r=>{
      const cutsHtml = Object.entries(r.cuts || {})
        .filter(([,v]) => v > 0)
        .map(([k,v]) => `<div class="cut-chip">${k}: <b>${v}</b></div>`)
        .join('') || '<div class="cut-chip">ไม่มีข้อมูลรายฝ่าย</div>';
      const time = r.ts ? new Date(r.ts).toLocaleString('th-TH') : '';
      return `
        <div class="card">
          <div class="card-top">
            <div>
              <div class="team-name">${escapeHtml(r.team)}</div>
              <div class="ts">${time}</div>
            </div>
            <div class="grade-pill" style="background:${gradeColor(r.crisisIndex)}22;color:${gradeColor(r.crisisIndex)};border:1px solid ${gradeColor(r.crisisIndex)};">
              ${gradeLabel(r.crisisIndex)} · CI ${r.crisisIndex}
            </div>
          </div>
          <div class="method-text">${escapeHtml(r.method || '(ไม่มีคำอธิบาย)')}</div>
          <div class="cuts-row">${cutsHtml}</div>
          <div class="score-row">
            <div class="score-pill">รวมปลด<b>${r.totalCut} (${r.pct}%)</b></div>
            <div class="score-pill">ระบบ<b>${r.ops}</b></div>
            <div class="score-pill">กฎหมาย<b>${r.legal}</b></div>
            <div class="score-pill">ภาพลักษณ์<b>${r.pr}</b></div>
            <div class="score-pill">ขวัญกำลังใจ<b>${r.morale}</b></div>
          </div>
          ${r.verdict ? `<div class="verdict-box">${escapeHtml(r.verdict)}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str){
    return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function refresh(){
    try{
      const rows = await loadData();
      renderStats(rows);
      renderCards(rows);
    }catch(err){
      $('#cards').innerHTML = `<div class="empty" style="color:var(--danger);">${err.message}</div>`;
    }
  }

  $('#btn-login').addEventListener('click', async ()=>{
    password = $('#pw').value;
    $('#login-err').textContent = '';
    try{
      const rows = await loadData();
      sessionStorage.setItem('bluebird_admin_pw', password);
      $('#login-view').style.display = 'none';
      $('#dashboard-view').style.display = 'block';
      renderStats(rows);
      renderCards(rows);
    }catch(err){
      $('#login-err').textContent = err.message;
    }
  });

  $('#pw').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#btn-login').click(); });

  $('#btn-refresh').addEventListener('click', refresh);

  $('#btn-reset').addEventListener('click', async ()=>{
    if(!confirm('ยืนยันล้างคำตอบของทุกทีม? การกระทำนี้ย้อนกลับไม่ได้')) return;
    try{
      const res = await fetch('/api/admin-reset', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'x-admin-password': password },
      });
      if(!res.ok) throw new Error('ล้างข้อมูลไม่สำเร็จ');
      await refresh();
    }catch(err){
      alert(err.message);
    }
  });

  // auto-login if password cached in this browser tab session
  if(password){
    loadData().then(rows=>{
      $('#login-view').style.display = 'none';
      $('#dashboard-view').style.display = 'block';
      renderStats(rows);
      renderCards(rows);
    }).catch(()=>{ sessionStorage.removeItem('bluebird_admin_pw'); });
  }
})();
</script>
</body>
</html>
